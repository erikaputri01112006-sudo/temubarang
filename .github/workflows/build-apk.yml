name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true 

      - name: Sync Android Gradle Wrapper & Fallback Launcher Icons
        run: |
          NEEDS_GRADLE_SYNC=false
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            NEEDS_GRADLE_SYNC=true
          elif grep -qE "gradle-(7\.|8\.|9\.[0-2]\.)" android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null; then
            NEEDS_GRADLE_SYNC=true
          fi

          if [ "$NEEDS_GRADLE_SYNC" = "true" ] || [ ! -f "android/app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            mkdir -p /tmp/flutter_template
            flutter create --platforms=android --org com.temubarang --project-name app /tmp/flutter_template
            if [ "$NEEDS_GRADLE_SYNC" = "true" ]; then
              cp -r /tmp/flutter_template/android/gradle android/
              cp /tmp/flutter_template/android/gradlew android/
              cp /tmp/flutter_template/android/gradlew.bat android/
              cp /tmp/flutter_template/android/settings.gradle.kts android/
              cp /tmp/flutter_template/android/build.gradle.kts android/
              cp /tmp/flutter_template/android/gradle.properties android/
              cp /tmp/flutter_template/android/app/build.gradle.kts android/app/
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(23, flutter.minSdkVersion)/' android/app/build.gradle.kts
              chmod +x android/gradlew
            fi
            if [ ! -f "android/app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
              cp -rn /tmp/flutter_template/android/app/src/main/res/mipmap-* android/app/src/main/res/
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL dan SUPABASE_ANON_KEY belum diatur di GitHub Repository Secrets!"
            exit 1
          fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: temubarang-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
